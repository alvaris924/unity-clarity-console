name: Feature request
description: Propose a feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Mockups and example queries are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap fit
      description: Where you think this belongs. Maintainers make the final call.
      options:
        - "Phase 1 - MVP (v0.1.0)"
        - "Phase 2 - Search and context (v0.5.0)"
        - "Phase 3 - Insight and polish (v1.0.0)"
        - "Later"
        - "Not sure"
